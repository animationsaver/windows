name: Ephemeral opencode Env (broker-managed)

# The opencode twin of ephemeral-env.yml.
#
# Same ubuntu-latest runner, same Tailscale SSH contract, same broker, and the
# same disposable-per-conversation lifecycle. Two things differ:
#
#   * The box joins the tailnet as gha-oc-<env_host> instead of
#     gha-env-<env_host>. An opencode environment is therefore a visibly
#     different host from a plain one, `tailscale status` says which workflow
#     built a box, and the two can never collide even on the same random id.
#   * It boots the opencode coding agent: `opencode serve` on loopback plus the
#     MCP bridge in front of it (nmt3325/opencode-mcp-bridge), both supervised
#     by scripts/opencode-mcp.sh. Neither port is published on the tailnet; the
#     broker reaches them the way it already reaches Playwright MCP, through an
#     SSH port forward, so the shell and the agent share one endpoint, one
#     bearer token and one env_id.
#
# ephemeral-env.yml is left completely untouched: anything that wants a plain
# machine keeps using it.
#
# The boot-latency fixes from ephemeral-env.yml apply here too and are kept
# byte-identical on purpose: the ssh-capability check that burned its full 30s
# timeout on every single boot, the apt step that installed a package already
# in the image, the static Tailscale tarball instead of an apt repo plus a
# second apt-get update, and the two fixed sleeps replaced by polls. The
# measurements are in that file s header.

on:
  workflow_dispatch:
    inputs:
      env_host:
        description: "Random lowercase id from the broker. Becomes the Tailscale hostname gha-oc-<env_host>. Not a secret: it is only reachable inside the tailnet."
        required: true
      ttl_minutes:
        description: "Minutes to keep the environment alive (job hard-stops at 6h anyway)"
        required: false
        default: "350"
      profile:
        description: "base = shell + opencode | playwright = also Playwright MCP"
        required: false
        default: "base"
      opencode_version:
        description: "opencode release to install, or 'latest'"
        required: false
        default: "latest"
      bridge_ref:
        description: "Branch or tag of the opencode MCP bridge to build"
        required: false
        default: "main"
      permission:
        description: "opencode permission mode written into its config: allow = the agent may run bash/edit unattended, ask = every action waits for a reply through the bridge's permission tools"
        required: false
        default: "allow"

# Never kill a session that is in use, and never run the same id twice. The
# group is prefixed like the hostname, so an opencode environment and a plain
# one with the same id are still two independent runs.
concurrency:
  group: gha-oc-${{ inputs.env_host }}
  cancel-in-progress: false

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ENV_HOST: ${{ inputs.env_host }}
      PROFILE: ${{ inputs.profile }}
      TTL_MINUTES: ${{ inputs.ttl_minutes }}
      PW_MCP_PORT: "8931"
      PW_MCP_VERSION: "0.0.79"
      # Must match the broker's OPENCODE_SERVE_PORT / OPENCODE_MCP_PORT.
      OPENCODE_SERVE_PORT: "4096"
      OPENCODE_MCP_PORT: "8788"
      OPENCODE_VERSION: ${{ inputs.opencode_version }}
      OPENCODE_BRIDGE_REF: ${{ inputs.bridge_ref }}
      OPENCODE_BRIDGE_REPO: ${{ vars.OPENCODE_BRIDGE_REPO || 'https://github.com/nmt3325/opencode-mcp-bridge.git' }}
      OPENCODE_PERMISSION: ${{ inputs.permission }}

    steps:
      - name: Validate env_host
        run: |
          if ! printf '%s' "$ENV_HOST" | grep -Eq '^[a-z0-9]{8,32}$'; then
            echo "::error::env_host must be 8-32 lowercase alphanumeric characters"
            exit 1
          fi
          echo "hostname will be gha-oc-$ENV_HOST"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git and gh to authenticate to GitHub via PAT (for SSH sessions)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT secret not set; skipping git/gh credential setup"
          else
            git config --global credential.helper store
            GH_LOGIN=$(GH_TOKEN="$GH_PAT" gh api user --jq .login 2>/dev/null || true)
            GH_UID=$(GH_TOKEN="$GH_PAT" gh api user --jq .id 2>/dev/null || true)
            : "${GH_LOGIN:=$GH_ACTOR}"
            if [ -n "${GH_UID:-}" ]; then
              GH_EMAIL="${GH_UID}+${GH_LOGIN}@users.noreply.github.com"
            else
              GH_EMAIL="${GH_LOGIN}@users.noreply.github.com"
            fi
            git config --global user.name "${GIT_USER_NAME:-$GH_LOGIN}"
            git config --global user.email "${GIT_USER_EMAIL:-$GH_EMAIL}"
            printf 'https://x-access-token:%s@github.com\n' "$GH_PAT" > "$HOME/.git-credentials"
            chmod 600 "$HOME/.git-credentials"
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            git -C "$GITHUB_WORKSPACE" config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git -C "$GITHUB_WORKSPACE" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git" 2>/dev/null || true
            echo "git configured for GitHub auth (user: $(git config --global user.name))"
            if printf '%s' "$GH_PAT" | gh auth login --hostname github.com \
                 --git-protocol https --with-token; then
              echo "gh authenticated as $(gh api user --jq .login 2>/dev/null || echo unknown)"
            else
              echo "::warning::gh auth login failed; gh CLI stays unauthenticated"
            fi
          fi

      - name: Ensure jq is present
        run: |
          # jq ships with ubuntu-latest (1.7.1 on 24.04), so the old
          # unconditional update+install spent 5-10s per boot re-indexing apt
          # to install a package that was already there -- apt history.log
          # recorded no transaction for it at all. Only pay that cost if a
          # future image really drops jq.
          if command -v jq > /dev/null 2>&1; then
            echo "jq $(jq --version) already present; skipping apt"
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq
          fi

      - name: Setup Node.js
        # Not conditional on the profile here: the MCP bridge is a Node
        # program, so every opencode environment needs a runtime.
        uses: actions/setup-node@v4
        with:
          # The PTY relay uses the global WebSocket API, available in Node 22+.
          node-version: "22"

      - name: Write the opencode environment file
        # Provider credentials live in one 0600 file rather than in the job
        # environment, because the processes that need them are detached and
        # are restarted later by the watchdog, in a step that has no access to
        # this step's secrets. opencode-mcp.sh sources this file on every
        # invocation, so a restart gets exactly the same environment as the
        # original boot. Nothing here is ever echoed.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_AGENT: ${{ vars.OPENCODE_AGENT }}
        run: ./scripts/opencode-mcp.sh write-env

      - name: Install opencode and the MCP bridge
        run: ./scripts/opencode-mcp.sh install

      - name: Install Playwright MCP (profile=playwright)
        if: inputs.profile == 'playwright'
        run: ./scripts/pw-mcp.sh install

      - name: Install Tailscale
        env:
          # Bump to move the whole fleet. This is the version the apt path was
          # installing anyway, and the fallback below covers a pulled release.
          TS_VERSION: "1.102.3"
        run: |
          # install.sh adds the Tailscale apt repo and then runs a *second*
          # full apt-get update before installing: 8-12s measured. The
          # official static tarball is the same two binaries, 2.3s to fetch
          # 38MB plus 0.5s to untar on this image. install.sh stays as the
          # fallback so a pulled release or an unreachable pkgs.tailscale.com
          # cannot stop an environment from booting.
          if curl -fsSL --max-time 60 -o /tmp/tailscale.tgz \
               "https://pkgs.tailscale.com/stable/tailscale_${TS_VERSION}_amd64.tgz" \
             && mkdir -p /tmp/tailscale-static \
             && tar -xzf /tmp/tailscale.tgz -C /tmp/tailscale-static --strip-components=1 \
             && sudo install -m 0755 /tmp/tailscale-static/tailscale /usr/local/bin/tailscale \
             && sudo install -m 0755 /tmp/tailscale-static/tailscaled /usr/local/sbin/tailscaled; then
            echo "TS_DAEMON=/usr/local/sbin/tailscaled" >> "$GITHUB_ENV"
            echo "static install: $(tailscale version | head -1)"
          else
            echo "::warning::static tailscale install failed; falling back to install.sh"
            curl -fsSL https://tailscale.com/install.sh | sh
            echo "TS_DAEMON=tailscaled" >> "$GITHUB_ENV"
          fi

      - name: Start tailscaled (userspace networking)
        run: |
          sudo setsid "${TS_DAEMON:-tailscaled}" --tun=userspace-networking --socks5-server=localhost:1055 \
            --statedir=/var/lib/tailscale < /dev/null > /tmp/tailscaled.log 2>&1 &
          # The old "sleep 5" was a guess at how long the daemon needs. Wait
          # for the control socket it actually has to create, and fail loudly
          # with the log instead of walking into a confusing "tailscale up"
          # error if it never shows up.
          for i in $(seq 1 150); do
            [ -S /var/run/tailscale/tailscaled.sock ] && break
            sleep 0.1
          done
          if [ ! -S /var/run/tailscale/tailscaled.sock ]; then
            echo "::error::tailscaled never created /var/run/tailscale/tailscaled.sock"
            cat /tmp/tailscaled.log || true
            exit 1
          fi
          echo "tailscaled socket ready"

      - name: Join tailnet as gha-oc-<env_host>
        run: |
          # TS_AUTHKEY must be an EPHEMERAL, reusable, pre-approved key, so the
          # node disappears from the tailnet by itself when the job ends.
          sudo tailscale up --authkey="${{ secrets.TS_AUTHKEY }}" \
            --hostname="gha-oc-$ENV_HOST" --ssh --accept-routes
          # "tailscale up" returns once the node is authenticated, but
          # .Self.DNSName can lag it by a moment, which is what the old
          # "sleep 3" was covering blind. Poll for the name instead.
          HOST=""
          for i in $(seq 1 100); do
            HOST=$(tailscale status --json 2>/dev/null | jq -r '.Self.DNSName // empty' | sed 's/\.$//')
            [ -n "$HOST" ] && break
            sleep 0.1
          done
          if [ -z "$HOST" ]; then
            echo "::error::tailscale never reported a DNSName for this node"
            exit 1
          fi
          echo "TS_HOST=$HOST" >> "$GITHUB_ENV"
          echo "tailnet host: $HOST"
          # On a name collision Tailscale silently appends "-1" and the broker
          # would end up talking to the wrong box. Fail loudly instead.
          case "$HOST" in
            gha-oc-$ENV_HOST.*) ;;
            *) echo "::error::hostname collision (got $HOST, expected gha-oc-$ENV_HOST.*)"; exit 1 ;;
          esac

      - name: Verify Tailscale SSH is accepting
        run: |
          # Confirms the ACL actually grants ssh to this node. Failing here is
          # far easier to diagnose than a broker timeout ten minutes later.
          #
          # Tailscale reports this capability as a URL, both as an element of
          # .Self.Capabilities and as a .Self.CapMap key:
          #   "https://tailscale.com/cap/ssh"
          # The old test was jq index("ssh"), which only matches an exact
          # "ssh" element, so it never matched on a current client: this step
          # spent its full 30s timeout in 14 of 14 sampled runs and never once
          # printed "tailscale ssh advertised". Accept the historical bare
          # form or any .../cap/ssh URL, and poll 4x faster.
          ok=""
          for i in $(seq 1 40); do
            if tailscale status --json 2>/dev/null \
                 | jq -e '[((.Self.CapMap // {}) | keys[]), ((.Self.Capabilities // [])[])] | any(. == "ssh" or endswith("/cap/ssh"))' > /dev/null 2>&1; then
              ok=1
              echo "tailscale ssh advertised"
              break
            fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then
            echo "::warning::tailscale never advertised an ssh capability; check that the tailnet ACL grants ssh to this node"
          fi
          tailscale status || true

      - name: Start opencode and the MCP bridge
        # Returns only once the bridge has answered a real MCP initialize, so
        # a broken install fails here instead of inside somebody's tool call.
        run: ./scripts/opencode-mcp.sh start

      - name: Start Playwright MCP (profile=playwright)
        if: inputs.profile == 'playwright'
        run: |
          "$GITHUB_WORKSPACE/scripts/pw-mcp.sh" start

      - name: Announce endpoints
        run: |
          echo "=================================================="
          echo "  Shell          : ssh runner@$TS_HOST   (Tailscale SSH, ACL gated)"
          echo "  opencode serve : 127.0.0.1:$OPENCODE_SERVE_PORT  (loopback only)"
          echo "  opencode MCP   : 127.0.0.1:$OPENCODE_MCP_PORT/mcp via SSH forward"
          echo "  Playwright MCP : 127.0.0.1:$PW_MCP_PORT via SSH forward (profile=playwright)"
          echo "=================================================="
          ./scripts/opencode-mcp.sh status || true

      - name: Keep alive
        run: |
          MIN="${TTL_MINUTES:-350}"
          case "$MIN" in ''|*[!0-9]*) MIN=350;; esac
          [ "$MIN" -le 0 ] && MIN=350
          [ "$MIN" -gt 350 ] && MIN=350
          echo "holding environment for $MIN minutes (broker can end it early via /tmp/stop.txt)"
          END=$(( $(date +%s) + MIN * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ -f /tmp/stop.txt ]; then echo "stop.txt detected -- shutting down"; break; fi
            if ! tailscale status > /dev/null 2>&1; then
              echo "$(date -Is) tailscaled is not responding"
            fi
            # One supervision tick each for the agent stack and the browser.
            "$GITHUB_WORKSPACE/scripts/opencode-mcp.sh" watchdog || true
            if [ "$PROFILE" = "playwright" ]; then
              "$GITHUB_WORKSPACE/scripts/pw-mcp.sh" watchdog || true
            fi
            sleep 30
          done

      - name: Collect logs
        if: always()
        run: |
          mkdir -p env-logs
          for f in /tmp/opencode-serve.log /tmp/opencode-mcp.log /tmp/pw-mcp.log /tmp/tailscaled.log; do
            [ -f "$f" ] && cp "$f" env-logs/ || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oc-env-logs-${{ inputs.env_host }}-${{ github.run_id }}
          path: env-logs
          retention-days: 3
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          ./scripts/opencode-mcp.sh stop || true
          sudo tailscale logout || true
