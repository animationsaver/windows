name: Ephemeral MCP Env (broker-managed)

# Disposable, per-conversation environment.
#
# Differences from ubuntu-playwright-mcp.yml (which is left untouched):
#   * Started on demand by the broker, never by cron.
#   * Nothing is published on the tailnet. The shell is reached over
#     Tailscale SSH, which tailscaled terminates itself, and Playwright MCP
#     is reached by the broker through an SSH port forward. No sshd, no
#     ssh-mcp, no mcp-proxy, no serve rule, no listening tailnet port.
#   * Access is authenticated by the tailnet identity of the caller, so an
#     ACL rule can allow the broker and nobody else.
#   * Hostname is a random id chosen by the broker, so two environments
#     can never collide.
#   * GH_PAT is injected (the same secret as ubuntu-playwright-mcp.yml) so
#     git push/pull and the gh CLI both work from Tailscale SSH sessions out
#     of the box.

on:
  workflow_dispatch:
    inputs:
      env_host:
        description: "Random lowercase id from the broker. Becomes the Tailscale hostname gha-env-<env_host>. Not a secret: it is only reachable inside the tailnet."
        required: true
      ttl_minutes:
        description: "Minutes to keep the environment alive (job hard-stops at 6h anyway)"
        required: false
        default: "350"
      profile:
        description: "base = shell only | playwright = shell + Playwright MCP"
        required: false
        default: "base"

# Never kill a session that is in use, and never run the same id twice.
concurrency:
  group: gha-env-${{ inputs.env_host }}
  cancel-in-progress: false

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ENV_HOST: ${{ inputs.env_host }}
      PROFILE: ${{ inputs.profile }}
      TTL_MINUTES: ${{ inputs.ttl_minutes }}
      PW_MCP_PORT: "8931"
      # Pinned on purpose: "@latest" re-resolves from the registry on every
      # start, so a restart could swap the server version mid-session.
      PW_MCP_VERSION: "0.0.79"

    steps:
      - name: Validate env_host
        run: |
          if ! printf '%s' "$ENV_HOST" | grep -Eq '^[a-z0-9]{8,32}$'; then
            echo "::error::env_host must be 8-32 lowercase alphanumeric characters"
            exit 1
          fi
          echo "hostname will be gha-env-$ENV_HOST"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git and gh to authenticate to GitHub via PAT (for SSH sessions)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          # Optional repository variables; override the identity
          # derived from the token below.
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT secret not set; skipping git/gh credential setup"
          else
            # credential.helper store reads ~/.git-credentials for every
            # https://github.com git operation, so any SSH session as 'runner'
            # can push/pull without re-entering credentials.
            git config --global credential.helper store
            # Identity comes from the credential, not from whoever started
            # the run: the actor and the owner of GH_PAT are frequently
            # different accounts. /user answers for classic and
            # fine-grained PATs alike; fall back to the actor for a token
            # it cannot name (a GitHub App installation token, say).
            GH_LOGIN=$(GH_TOKEN="$GH_PAT" gh api user --jq .login 2>/dev/null || true)
            GH_UID=$(GH_TOKEN="$GH_PAT" gh api user --jq .id 2>/dev/null || true)
            : "${GH_LOGIN:=$GH_ACTOR}"
            # id+login is the only noreply form GitHub links back to an
            # account created after 2017-07-18.
            if [ -n "${GH_UID:-}" ]; then
              GH_EMAIL="${GH_UID}+${GH_LOGIN}@users.noreply.github.com"
            else
              GH_EMAIL="${GH_LOGIN}@users.noreply.github.com"
            fi
            git config --global user.name "${GIT_USER_NAME:-$GH_LOGIN}"
            git config --global user.email "${GIT_USER_EMAIL:-$GH_EMAIL}"
            printf 'https://x-access-token:%s@github.com\n' "$GH_PAT" > "$HOME/.git-credentials"
            chmod 600 "$HOME/.git-credentials"
            # Route any SSH-style remote (git@github.com:/ssh://) through
            # authenticated HTTPS so existing clones also work with the PAT.
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            # actions/checkout injects a short-lived GITHUB_TOKEN via
            # http.extraheader on the workspace repo; drop it so SSH sessions
            # fall back to the PAT credential helper instead of an expired token.
            git -C "$GITHUB_WORKSPACE" config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git -C "$GITHUB_WORKSPACE" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git" 2>/dev/null || true
            echo "git configured for GitHub auth (user: $(git config --global user.name))"
            # The gh CLI keeps its own credential store
            # (~/.config/gh/hosts.yml) and never reads ~/.git-credentials, so
            # it has to be logged in separately with the same PAT. Do NOT run
            # 'gh auth setup-git' afterwards: it would replace the 'store'
            # credential helper configured above.
            if printf '%s' "$GH_PAT" | gh auth login --hostname github.com \
                 --git-protocol https --with-token; then
              echo "gh authenticated as $(gh api user --jq .login 2>/dev/null || echo unknown)"
            else
              echo "::warning::gh auth login failed; gh CLI stays unauthenticated"
            fi
          fi

      - name: Install base packages
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq

      - name: Setup Node.js (profile=playwright)
        if: inputs.profile == 'playwright'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright MCP (profile=playwright)
        if: inputs.profile == 'playwright'
        # Installs the pinned server and the browser build that *that* server
        # asks for. "npx playwright install" resolved a different playwright
        # release, which is how this image ended up with chromium-1234 on disk
        # while the server demanded chromium-1237 and refused to start.
        run: ./scripts/pw-mcp.sh install

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start tailscaled (userspace networking)
        run: |
          sudo setsid tailscaled --tun=userspace-networking --socks5-server=localhost:1055 \
            --statedir=/var/lib/tailscale < /dev/null > /tmp/tailscaled.log 2>&1 &
          sleep 5

      - name: Join tailnet as gha-env-<env_host>
        run: |
          # TS_AUTHKEY must be an EPHEMERAL, reusable, pre-approved key.
          # Ephemeral nodes are removed automatically when the job ends, which
          # is why this workflow needs no stale-device cleanup (and therefore
          # cannot delete a sibling environment by accident).
          #
          # --ssh starts the SSH server built into tailscaled. It works under
          # userspace-networking because tailscaled handles the connection
          # in-process; no serve rule and no sshd are involved.
          sudo tailscale up --authkey="${{ secrets.TS_AUTHKEY }}" \
            --hostname="gha-env-$ENV_HOST" --ssh --accept-routes
          sleep 3
          HOST=$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          echo "TS_HOST=$HOST" >> "$GITHUB_ENV"
          echo "tailnet host: $HOST"
          # On a name collision Tailscale silently appends "-1" and the broker
          # would end up talking to the wrong box. Fail loudly instead.
          case "$HOST" in
            gha-env-$ENV_HOST.*) ;;
            *) echo "::error::hostname collision (got $HOST, expected gha-env-$ENV_HOST.*)"; exit 1 ;;
          esac

      - name: Verify Tailscale SSH is accepting
        run: |
          # Confirms the ACL actually grants ssh to this node. Failing here is
          # far easier to diagnose than a broker timeout ten minutes later.
          for i in $(seq 1 15); do
            if tailscale status --json | jq -e '.Self.Capabilities // [] | index("ssh")' > /dev/null 2>&1; then
              echo "tailscale ssh advertised"; break
            fi
            sleep 2
          done
          tailscale status || true

      - name: Start Playwright MCP (profile=playwright)
        if: inputs.profile == 'playwright'
        run: |
          # Bound to loopback and never published on the tailnet: the broker
          # reaches it through an SSH port forward, so the only way in is an
          # ACL-authorised SSH session. That is also why the server runs with
          # --allowed-hosts '*': the Host header is whatever local port
          # asyncssh happened to pick, and there is no browser in the path to
          # protect. Without it every browser_call is a 403.
          # start returns only once a real MCP initialize has succeeded, so a
          # browser that cannot launch fails here instead of twenty minutes
          # later inside somebody's browser_call.
          "$GITHUB_WORKSPACE/scripts/pw-mcp.sh" start

      - name: Announce endpoints
        run: |
          echo "=================================================="
          echo "  Shell          : ssh runner@$TS_HOST   (Tailscale SSH, ACL gated)"
          echo "  Playwright MCP : 127.0.0.1:$PW_MCP_PORT via SSH forward (profile=playwright)"
          echo "=================================================="

      - name: Keep alive
        run: |
          MIN="${TTL_MINUTES:-350}"
          case "$MIN" in ''|*[!0-9]*) MIN=350;; esac
          [ "$MIN" -le 0 ] && MIN=350
          [ "$MIN" -gt 350 ] && MIN=350
          echo "holding environment for $MIN minutes (broker can end it early via /tmp/stop.txt)"
          END=$(( $(date +%s) + MIN * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ -f /tmp/stop.txt ]; then echo "stop.txt detected -- shutting down"; break; fi
            # The shell has no daemon of its own to babysit; if tailscaled is
            # gone the box is unreachable and there is nothing to recover.
            if ! tailscale status > /dev/null 2>&1; then
              echo "$(date -Is) tailscaled is not responding"
            fi
            if [ "$PROFILE" = "playwright" ]; then
              # One supervision tick. The old line here probed with "curl -sf",
              # which a healthy playwright-mcp answers with 400 Invalid request
              # -- the Streamable HTTP transport wants an Accept of
              # text/event-stream and a session id -- so -f made it exit 22 and
              # this loop restarted a working server every 30 seconds for the
              # life of the job, each replacement dying on EADDRINUSE.
              "$GITHUB_WORKSPACE/scripts/pw-mcp.sh" watchdog || true
            fi
            sleep 30
          done

      - name: Collect logs
        if: always()
        run: |
          mkdir -p env-logs
          for f in /tmp/pw-mcp.log /tmp/tailscaled.log; do
            [ -f "$f" ] && cp "$f" env-logs/ || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-logs-${{ inputs.env_host }}-${{ github.run_id }}
          path: env-logs
          retention-days: 3
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          # Ephemeral auth key => the node disappears from the tailnet by itself.
          sudo tailscale logout || true
