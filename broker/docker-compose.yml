services:
  broker:
    # Prebuilt by .github/workflows/broker-image.yml. Update with:
    #   docker compose pull && docker compose up -d
    # Pin a digest or a sha- tag instead of :latest if you want reproducibility.
    image: ${BROKER_IMAGE:-ghcr.io/animationsaver/windows/broker:latest}
    # Only used by `docker compose build` / `--build`; `up` prefers the image
    # above, so a plain `docker compose up -d` never compiles anything.
    build: .
    pull_policy: always
    container_name: gha-env-broker
    restart: unless-stopped
    env_file: .env
    # Host networking so the container can reach the tailnet (100.64.0.0/10)
    # and resolve MagicDNS names through the host's tailscaled.
    network_mode: host
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  broker-data:
