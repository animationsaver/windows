services:
  broker:
    # Prebuilt by .github/workflows/broker-image.yml. Update with:
    #   docker compose pull && docker compose up -d
    # Pin a digest or a sha- tag instead of :latest if you want reproducibility.
    image: ${BROKER_IMAGE:?set BROKER_IMAGE in broker/.env, e.g. ghcr.io/<owner>/<repo>/broker:latest}
    # Only used by `docker compose build` / `--build`; `up` prefers the image
    # above, so a plain `docker compose up -d` never compiles anything.
    build: .
    pull_policy: always
    container_name: gha-env-broker
    restart: unless-stopped
    env_file: .env

    # Loopback only. The single public entry point is
    #   tailscale funnel --bg --https=443 http://127.0.0.1:8080
    # which proxies from the host itself. Drop the 127.0.0.1 prefix only if
    # you deliberately want to reach the broker from your LAN.
    ports:
      - "127.0.0.1:8080:8080"

    # Reaching the tailnet (100.64.0.0/10) already works from a bridge
    # network: the container's default route points at the host, which has a
    # route via tailscale0 and masquerades the traffic. Only *resolution*
    # needs help -- Docker discards loopback nameservers, so the
    # 127.0.0.53 stub that systemd-resolved advertises MagicDNS on never
    # reaches the container. Point at Tailscale's resolver directly instead.
    #
    # Requires tailscaled on this host to run in kernel mode (check with
    # `ip a | grep tailscale0`); under --tun=userspace-networking there is no
    # 100.100.100.100 to talk to, and you would need network_mode: host.
    dns:
      - 100.100.100.100
    dns_search:
      # Lets the broker resolve bare hostnames too. Interpolated from .env.
      - ${TAILNET_DOMAIN:?set TAILNET_DOMAIN in broker/.env}

    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  broker-data:
