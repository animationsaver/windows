services:
  broker:
    # Prebuilt by .github/workflows/broker-image.yml. Update with:
    #   docker compose pull && docker compose up -d
    # Pin a digest or a sha- tag instead of :latest if you want reproducibility.
    image: ${BROKER_IMAGE:-ghcr.io/animationsaver/windows/broker:latest}
    # Only used by `docker compose build` / `--build`; `up` prefers the image
    # above, so a plain `docker compose up -d` never compiles anything.
    build: .
    pull_policy: always
    container_name: gha-env-broker
    restart: unless-stopped
    env_file: .env
    # Host networking, so:
    #   * outbound: the container can reach the tailnet (100.64.0.0/10) and
    #     resolve MagicDNS names through the host's tailscaled;
    #   * inbound: there is nothing to publish. The container shares the
    #     host's network namespace, so the port below IS the host's port.
    #     A `ports:` mapping would be ignored here.
    network_mode: host
    # Loopback only. The sole public entry point is
    #   tailscale funnel --bg --https=443 http://127.0.0.1:8080
    # which proxies from the host itself, so the broker never needs to be
    # bound to a LAN or public interface. Change to 0.0.0.0 only if you
    # deliberately want to reach it from your LAN.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8080"
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  broker-data:
